name: Release

# Push a tag like v2.0 to build and publish a release.
# "Run workflow" on the Actions page only builds (nothing is published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl xz-utils file xvfb \
            libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0 libegl1 \
            libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the AppImage and the tarball
        run: bash ./packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      # The AppImage has to stay open for a few seconds. This catches start-up crashes before a release.
      # It does not stop the release if the virtual screen itself misbehaves (continue-on-error).
      - name: Smoke test
        continue-on-error: true
        env:
          QT_QUICK_BACKEND: software
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set +e
          xvfb-run -a timeout 8 dist/ChaoticNotepad-*-x86_64.AppImage
          code=$?
          if [ "$code" -ne 124 ]; then
            echo "The app exited early with code $code"
            exit 1
          fi

      - name: Keep the files from this run
        uses: actions/upload-artifact@v4
        with:
          name: ChaoticNotepad-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.xz
            dist/SHA256SUMS.txt
          generate_release_notes: true
